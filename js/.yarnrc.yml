nodeLinker: node-modules
enableGlobalCache: false
cacheFolder: .yarn/cache

# Supply-chain hardening (Shai-Hulud-style worms spread via install scripts
# and freshly published malicious versions).
# Per-package script exceptions go in dependenciesMeta in package.json.
enableScripts: false

# Matches the 7-day dependabot cooldown.
npmMinimalAgeGate: 7d

# Materialize optional deps for every flake build system (darwin + linux,
# arm64 + x64) so the tracked .yarn/cache works for all of them.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl
